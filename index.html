<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiro's Blog</title>
    <style>
        /* 基础样式复位 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            /* 背景图优化：使用 cover 铺满 */
            background: url('1.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #616f80;
            color: #fff;
            line-height: 1.8;
            min-height: 100vh;
        }

        /* 顶部标题区 */
        .header {
            height: 40vh; /* 占据屏幕高度的 40% */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* 渐变遮罩让标题更清晰 */
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 3.5rem;
            color: #fff6a8; /* 浅淡的黄色，呼应魔理沙 */
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }

        /* 主体容器 */
        .container {
            max-width: 800px; /* 稍微放宽，在大屏下更好看 */
            margin: -50px auto 40px; /* 向上偏移，产生重叠感 */
            padding: 0 20px;
        }

        /* 列表卡片 */
        .post-list {
            background: rgba(255, 255, 255, 0.2); /* 浅色半透明 */
            backdrop-filter: blur(5px); /* 磨砂玻璃效果 */
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 文章项 */
        .post-item {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease; /* 动画过渡 */
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            transform: translateX(10px); /* 鼠标悬停轻微右移 */
        }

        /* 链接样式 */
        .post-title {
            font-size: 1.6rem;
            color: #fff6a8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }

        .post-meta {
            color: #eee;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* 响应式适配：手机端 */
        @media (max-width: 600px) {
            .header {
                height: 30vh;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .container {
                margin-top: -30px;
            }
            .post-list {
                padding: 15px 20px;
                border-radius: 15px;
            }
            .post-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Shiro's Blog</h1>
        <p>⭐ Ordinary Magician's Notebook ⭐</p>
    </div>

    <div class="container">
        <div class="post-list">
            <div class="post-item">
                <a href="novel/novel0.html" class="post-title">Novel</a>
                <div class="post-meta">stories</div>
            </div>

            <div class="post-item">
                <a href="painting/painting.html" class="post-title">Painting</a>
                <div class="post-meta">Draw...</div>
            </div>

            <div class="post-item">
                <a href="fumo/fumo.html" class="post-title">Fumo</a>
                <div class="post-meta">fumofumo ~ ᗜˬᗜ</div>
            </div>

            <div class="post-item">
                <a href="#" class="post-title">Update</a>
                <div class="post-meta">Coming soon...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Shiro's Blog</p>
        <p>Powered by Magic & Fumos</p>
    </div>

</body>
</html>
