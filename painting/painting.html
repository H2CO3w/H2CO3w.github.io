<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fumo Collection - Shiro's Blog</title>
    <style>
        /* 基础样式复位 - 与主页严格一致 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            /* 跨层级调用根目录背景图 */
            background: url('../1.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #616f80;
            color: #fff;
            line-height: 1.8;
            min-height: 100vh;
        }

        .header {
            height: 40vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 3.5rem;
            color: #fff6a8;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1000px; /* 展示图片可以比文字页稍宽 */
            margin: -50px auto 40px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #fff6a8;
            font-size: 0.9rem;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .back-link:hover { transform: translateX(-5px); }

        /* 照片墙容器 */
        .fumo-grid {
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            /* 网格布局 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* 单个图片卡片 */
        .fumo-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fumo-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .fumo-item img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* 确保图片比例一致 */
            display: block;
            transition: 0.5s;
        }

        .fumo-item:hover img {
            transform: scale(1.1);
        }

        .fumo-info {
            padding: 12px;
            text-align: center;
        }

        .fumo-date {
            font-size: 0.8rem;
            color: #fff6a8;
            font-family: monospace;
        }

        .footer {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .header { height: 30vh; }
            .header h1 { font-size: 2.2rem; }
            .container { margin-top: -30px; }
            .fumo-grid { 
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); /* 手机端每行两个 */
                padding: 15px;
                gap: 10px;
            }
            .fumo-item img { height: 150px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Painting:)</h1>
        <p></p>
    </div>

    <div class="container">
        <a href="../index.html" class="back-link">← BACK</a>

        <div class="fumo-grid">
            <div class="fumo-item">
                <img src="20260309001.jpg" alt="Fumo">
                <div class="fumo-info">
                    <div class="fumo-date">2026.03.09 - #001</div>
                </div>
            </div>

            <div class="fumo-item">
                <img src="20260309002.jpg" alt="Fumo">
                <div class="fumo-info">
                    <div class="fumo-date">2026.03.09 - #002</div>
                </div>
            </div>

            <div class="fumo-item">
                <img src="20260309003.jpg" alt="Fumo">
                <div class="fumo-info">
                    <div class="fumo-date">2026.03.09 - #003</div>
                </div>
            </div>
    </div>

    <div class="footer">
        <p>© 2026 Shiro's Blog</p>
    </div>

</body>
</html>
