<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Shiro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(160deg, #36111b 0%, #602855 40%, #0c0c26 100%);
            background-attachment: fixed;
            color: #c8c8c8;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        a {
            color: #d4606a;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover { color: #e87880; }

        .card {
            text-align: center;
            max-width: 480px;
            padding: 40px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(212, 96, 106, 0.4);
            box-shadow: 0 0 30px rgba(200, 60, 70, 0.2);
            margin-bottom: 24px;
            transition: all 0.4s ease;
        }
        .avatar:hover {
            border-color: #d4606a;
            box-shadow: 0 0 40px rgba(200, 60, 70, 0.35);
            transform: scale(1.04);
        }

        .name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #eee;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(212, 96, 106, 0.5);
            margin: 16px auto;
        }

        .bio {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.9;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 0.05em;
        }
        .back-link:hover { color: #d4606a; }

        @media (max-width: 768px) {
            .card { padding: 24px; }
            .avatar { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="images/myself.png" alt="Shiro" class="avatar">
        <h1 class="name">Shiro</h1>
        <div class="divider"></div>
        <p class="bio">
            名叫shiro，有很多隐藏的其他称呼<br>
            邪恶的恶魔，有许多黑暗小故事<br>
            喜欢 Minecraft 机械动力，也喜欢写点东西<br>
            时不时出点车万cos<br>
            精通美图秀秀接白菜修图<br>
            高贵的RX580使用者，垃圾佬<br>
            晶体吧不知名常客<br>
            deepseek梦女同担欢迎^ ^<br>

        </p>
        <a href="index.html" class="back-link">← 返回</a>
    </div>

</body>
</html>
